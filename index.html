<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbd3dd">
<title>A Little Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lilita+One&family=Playfair+Display:wght@500;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f4799f; --pink-d:#d9457a; --pink-l:#ffd3e0; --blush:#fde6ec; --ink:#7a2b45;
  --sa:#fbcfdb; --sb:#fff3f6;
  --shadow:0 10px 24px rgba(170,60,100,.28);
  --mx:0; --my:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Playfair Display",Georgia,serif;color:var(--ink);overflow:hidden;overscroll-behavior:none;background:#fde6ec;touch-action:manipulation}
svg{display:block}

/* ============ screens ============ */
.screen{position:fixed;inset:0;display:none;overflow-x:hidden;overflow-y:auto;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  background:var(--bg,#fde6ec)}
.screen.active{display:flex;animation:enter .55s cubic-bezier(.2,.9,.3,1.2) both}
.screen.leaving{animation:leave .35s ease both}
@keyframes enter{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:scale(1.04)}}
.stripes{--bg:repeating-linear-gradient(90deg,var(--sa) 0 30px,var(--sb) 30px 60px)}
.plain{--bg:radial-gradient(circle at 20% 15%,#fff6f8,#fbd9e3 70%)}
.stage{position:relative;width:min(1040px,100%);margin:auto;display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,70px);flex-wrap:wrap;z-index:2}

/* ============ stickers ============ */
.deco{position:absolute;pointer-events:none;z-index:1;
  --d:0;transform:translate(calc(var(--mx)*var(--d)*1px),calc(var(--my)*var(--d)*1px)) rotate(var(--r,0deg));
  transition:transform .25s ease-out;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 3px 5px rgba(120,40,70,.25))}
.deco svg{width:100%;height:auto}
.float-y{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -10px}}
.sway{animation:sway 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{rotate:4deg}}
.sticker{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 6px 8px rgba(120,40,70,.3))}

/* ============ glossy titles ============ */
.balloon{font-family:"Lilita One",system-ui,sans-serif;margin:0;text-align:center;line-height:.98;letter-spacing:.02em;
  font-size:clamp(38px,9vw,92px);color:transparent;
  --fill:linear-gradient(180deg,#ffb3cf 0%,#ff6fa3 38%,#e63d82 60%,#ff8fba 100%);
  filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 0 rgba(200,50,100,.4))}
.balloon span{background:var(--fill);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.balloon.chrome{--fill:linear-gradient(180deg,#fff 0%,#ffa6c8 22%,#e0397d 52%,#9c1d55 70%,#ff7fb2 100%);
  filter:drop-shadow(0 4px 0 rgba(150,20,80,.35)) drop-shadow(0 8px 10px rgba(150,20,80,.3))}
.pop-in span{display:inline-block;animation:letter .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{from{opacity:0;transform:translateY(40px) scale(.4) rotate(-12deg)}}

/* ============ buttons ============ */
.btn{font-family:"Lilita One",system-ui,sans-serif;font-size:clamp(20px,4.8vw,32px);letter-spacing:.06em;color:#fff;border:0;cursor:pointer;
  padding:.45em 1.7em;border-radius:999px;min-width:120px;position:relative;overflow:hidden;
  background:linear-gradient(#f9a9c4,#d9457a);box-shadow:inset 0 4px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(120,20,60,.18),var(--shadow);
  text-shadow:0 2px 0 rgba(120,20,60,.35);transition:transform .15s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3s infinite}
@keyframes shine{60%,100%{left:130%}}
.btn:hover{transform:translateY(-3px) scale(1.05)}
.btn:active{transform:scale(.93)}
.btn.mauve{background:linear-gradient(#e5bccb,#a9758d)}
.row{display:flex;gap:clamp(12px,3vw,26px);flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3vh,30px);position:relative;z-index:2}

/* ============ photo slot ============ */
.ph{position:relative;background:linear-gradient(135deg,#fbd0dd,#eaa9c0);display:grid;place-items:center;overflow:hidden;color:#fff}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .pl{font-family:"Caveat";font-size:24px;opacity:.9;text-align:center;line-height:1}
.ph .pl svg{width:42px;margin:0 auto 4px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
body.edit .ph{cursor:pointer;outline:3px dashed #fff}

/* ============ SCREEN 1 ============ */
.camera{position:relative;width:clamp(230px,36vw,400px);aspect-ratio:1.02;border-radius:32px;transform:rotate(-4deg);
  background:linear-gradient(155deg,#e2f3e8,#a8d3b9 60%,#8fbfa3);box-shadow:inset 0 4px 0 #fff8,inset 0 -8px 0 #6a9f8344,var(--shadow);padding:5% 5% 8%;
  transition:transform .4s}
.camera:hover{transform:rotate(1deg) scale(1.04)}
.camera .top{height:8%;display:flex;gap:8px;align-items:center;padding:0 4%;margin-bottom:3%}
.camera .top i{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 0 -3px 0 #0001}
.camera .top b{margin-left:auto;font-family:"Caveat";font-size:20px;color:#5c8a72}
.camera .lens{width:100%;height:76%;border-radius:20px;border:7px solid #fff;overflow:hidden;box-shadow:inset 0 0 0 4px #7fb095}
.camera .lens .ph{width:100%;height:100%}
.camera .btns{display:flex;justify-content:center;gap:12px;margin-top:4%}
.camera .btns i{width:44px;height:14px;border-radius:9px;background:#fff;opacity:.9}
.camera .flash{position:absolute;top:-4%;right:10%;width:15%;height:8%;background:#fff;border-radius:6px;box-shadow:0 0 14px #fff;animation:flash 3.5s infinite}
@keyframes flash{0%,90%,100%{opacity:.7}94%{opacity:1;box-shadow:0 0 40px 14px #fff}}
.askblock .balloon{font-size:clamp(44px,10.5vw,104px)}
@media (min-width:900px){
  .askblock{flex-wrap:nowrap}
  .askblock .balloon{font-size:clamp(48px,6vw,88px)}
  .askblock .camera{width:clamp(260px,28vw,380px)}
}
@media (max-width:780px){.heading{padding-top:34px}}
@media (max-height:620px) and (min-width:900px){.askblock .balloon{font-size:clamp(40px,5vw,64px)}}

/* ============ SCREEN 2 ============ */
.heartwrap{position:relative;width:clamp(250px,40vw,450px);aspect-ratio:1/.93}
.heartwrap>svg.frame{position:absolute;inset:-4%;width:108%;height:108%;overflow:visible;filter:drop-shadow(0 8px 12px rgba(170,60,100,.3))}
.heartclip{position:absolute;inset:0;clip-path:url(#heartClip)}
.heartclip .ph{width:100%;height:100%}
.heartwrap .bear{position:absolute;right:-9%;bottom:-8%;width:36%}
.pad{position:relative;width:clamp(250px,34vw,330px);padding:22px 20px 24px;border-radius:30px;color:#fff;
  background:#f27c9f;box-shadow:var(--shadow);
  --scal:radial-gradient(circle at 50% 100%,transparent 9px,#f27c9f 10px)}
.pad::before{content:"";position:absolute;inset:-9px;border-radius:36px;z-index:-1;
  background:radial-gradient(circle,#f27c9f 7px,transparent 8px) 0 0/22px 22px;}
.pad h3{margin:0;text-align:center;font-family:"Playfair Display";font-size:15px;letter-spacing:.14em}
.pad .hint{text-align:center;font-family:"Caveat";font-size:21px;margin:2px 0 6px}
.dispcode{display:flex;justify-content:center;gap:12px;margin:4px 0 14px}
.dispcode i{width:20px;height:20px;border-radius:50%;border:3px solid #fff;transition:.2s}
.dispcode i.on{background:#fff;transform:scale(1.2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{aspect-ratio:1;border-radius:50%;border:0;background:#fff;color:#d06a8c;cursor:pointer;font-family:"Playfair Display";font-size:clamp(22px,5.4vw,28px);
  box-shadow:0 0 0 4px #f27c9f,0 0 0 6px #ffd3e0,0 5px 0 6px #c9567c33;transition:transform .1s,background .2s;position:relative}
.key:hover{background:#fff0f4}
.key:active{transform:scale(.88);background:#ffd3e0}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

/* ============ SCREEN 3 ============ */
.nope{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,60px);flex-wrap:wrap;position:relative;z-index:2;margin:auto}
.nope .cat{width:clamp(170px,32vw,320px);animation:grumpy 1.6s ease-in-out infinite}
@keyframes grumpy{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(3deg) scale(1.05)}}

/* ============ SCREEN 4 ============ */
.bunting{position:absolute;top:-2px;left:0;width:min(560px,70vw);z-index:1}
.env-stage{position:relative;width:min(980px,100%);margin:auto;display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,56px);flex-wrap:wrap;z-index:2;padding-top:clamp(40px,10vh,90px)}
.partycat{width:clamp(150px,26vw,260px)}
.envwrap{position:relative;display:grid;place-items:center}
.envelope{position:relative;width:clamp(220px,36vw,360px);aspect-ratio:1.5;border:0;background:none;padding:0;cursor:pointer;perspective:900px;
  animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.envelope:hover{animation-play-state:paused}
.envelope .back{position:absolute;inset:0;background:#f9d0da;border-radius:10px;box-shadow:var(--shadow)}
.envelope .paper{position:absolute;left:7%;right:7%;top:6%;bottom:8%;background:#fffdf3;border-radius:6px;transition:transform .9s cubic-bezier(.3,1.2,.4,1);
  display:grid;place-items:center;font-family:"Caveat";font-size:clamp(20px,4vw,30px);color:#c9567c}
.envelope .front{position:absolute;inset:0;background:linear-gradient(135deg,#fce3ea,#f7c3d2);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:10px}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#fbd3de,#f3a9bf);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .7s ease-in-out,z-index 0s .35s;z-index:3;border-radius:10px 10px 0 0}
.envelope .seal{position:absolute;left:50%;top:47%;width:16%;transform:translate(-50%,-50%);z-index:4;transition:opacity .3s}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .paper{transform:translateY(-48%)}
.envelope.open .seal{opacity:0}
.tap{font-family:"Caveat";font-size:26px;color:var(--pink-d);margin-top:14px;text-align:center;display:flex;gap:6px;justify-content:center;align-items:center}
.tap svg{width:34px;animation:point 1.1s ease-in-out infinite}
@keyframes point{50%{transform:translate(-6px,-8px)}}
.note{position:relative;width:clamp(140px,22vw,200px);padding:26px 14px;text-align:center;background:#fffbe9;box-shadow:var(--shadow);transform:rotate(3deg);
  font-family:"Lilita One";font-size:clamp(22px,4.4vw,34px);color:#2f2326;line-height:1.1}
.note .tape{position:absolute;top:-12px;left:50%;width:70px;height:24px;background:rgba(244,121,159,.5);transform:translateX(-50%) rotate(-5deg)}

/* ============ SCREEN 5 ============ */
#s5{align-items:flex-start}
.collage{position:relative;width:min(1080px,100%);margin:0 auto;padding:clamp(10px,3vh,30px) 0 60px;display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(16px,3vw,44px);align-items:start;z-index:2}
@media (max-width:780px){.collage{grid-template-columns:1fr}}
.heading{grid-column:1/-1;position:relative}
.cursive{font-family:"Caveat";font-weight:700;color:var(--pink-d);text-align:center;font-size:clamp(38px,8vw,64px);margin:6px 0 0;transform:rotate(-3deg);text-shadow:2px 2px 0 #fff}
.board{position:relative;min-height:clamp(380px,56vw,540px);touch-action:none}
.poly{position:absolute;background:#fff;padding:9px 9px 30px;box-shadow:var(--shadow);width:clamp(130px,27vw,215px);cursor:grab;user-select:none;touch-action:none;
  transition:box-shadow .2s,scale .2s}
.poly.drag{cursor:grabbing;box-shadow:0 22px 34px rgba(120,30,70,.4);scale:1.06}
.poly .ph{aspect-ratio:1/1.12}
.poly .cap{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:"Shadows Into Light","Caveat";font-size:17px;color:#a05a73}
.poly .tape{position:absolute;top:-12px;left:50%;width:64px;height:22px;background:rgba(244,121,159,.5);transform:translateX(-50%) rotate(-4deg)}
.p1{left:1%;top:3%;rotate:-6deg}.p2{left:30%;top:36%;rotate:3deg;width:clamp(140px,30vw,240px)}.p3{right:0;top:6%;rotate:7deg}
.hint-drag{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:"Caveat";font-size:20px;color:#b8607f;opacity:.85}
.letter{position:relative;background:#e7f2dd;border-radius:6px;padding:clamp(20px,3.4vw,34px);box-shadow:var(--shadow);rotate:-1deg;
  font-family:"Caveat",cursive;font-size:clamp(22px,4.6vw,28px);line-height:34px;color:#38472f;
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(100,140,90,.2) 33px 34px)}
.letter p{margin:0 0 34px;opacity:0;animation:fadeup .8s ease forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.letter .sign{display:block;text-align:right;font-weight:700;opacity:0;animation:fadeup .8s ease forwards}
.letter .clip{position:absolute;top:-16px;right:24px;width:40px}

/* ============ effects ============ */
.fx{position:fixed;pointer-events:none;z-index:50;left:0;top:0}
.fx svg{width:100%;height:100%}
.burst{animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(var(--rot));opacity:0}}
.rise{animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(60deg);opacity:0}}
.mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:60;background:#fff;border:0;border-radius:50%;width:44px;height:44px;box-shadow:var(--shadow);cursor:pointer;font-size:20px}
.editbar{position:fixed;left:50%;bottom:10px;translate:-50% 0;z-index:70;background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font:600 14px system-ui;display:none}
body.edit .editbar{display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>

<script>
/* ===========================================================
   CONFIG — change everything about the page right here
   =========================================================== */
const CONFIG = {
  herName:  "Her Name",
  yourName: "Your Name",
  passcode: "1234",                          // digits only
  hint:     "hint: our special day (DDMM)",
  // Put your 5 photos in a folder called "photos" next to this file.
  // 0 camera · 1 heart · 2,3,4 polaroids.  Use "" to keep a placeholder.
  photos: ["photos/1.jpg","photos/2.jpg","photos/3.jpg","photos/4.jpg","photos/5.jpg"],
  captions: ["Happy","Birthday","my love"],  // polaroid captions
  music: "",                                 // e.g. "music.mp3"
  introTitle:   "DO YOU\nWANT A\nSURPRISE??",
  wrongTitle:   "NOOOO!!!\nTRY AGAIN",
  headline:     "MY PRETTY GIRL",
  birthdayLine: "Happy Birthday!",
  letter: [
    "Happy Birthday to the most special person in my life.",
    "You are not just my girlfriend, but also my best friend, my biggest supporter, and the person who makes my days brighter.",
    "I love that we've grown up together and I can't wait to keep growing with you.",
    "I can't say this enough, but I'm incredibly lucky to have you. Thank you for being you."
  ]
};
/* =========================================================== */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EDIT = /[?&]edit\b/.test(location.search);
if (EDIT) document.body.classList.add('edit');
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

/* ---------- text ---------- */
function popTitle(el, text){
  el.innerHTML = text.split('\n').map(line =>
    [...line].map((ch,i)=> ch===' ' ? ' ' : `<span style="animation-delay:${i*45}ms">${esc(ch)}</span>`).join('')
  ).join('<br>');
}
popTitle($('#askTitle'),  CONFIG.introTitle);
popTitle($('#nopeTitle'), CONFIG.wrongTitle);
popTitle($('#prettyTitle'), CONFIG.headline);
$('#hbLine').textContent = CONFIG.birthdayLine;
$('#hint').textContent   = CONFIG.hint;
CONFIG.captions.forEach((c,i)=> $('#cap'+(i+1)).textContent = c);
document.title = `A little surprise for ${CONFIG.herName}`;
const letterEl = $('#letter');
CONFIG.letter.forEach((p,i)=>{ const e=document.createElement('p'); e.textContent=p; e.style.animationDelay=(1.2+i*1.1)+'s'; letterEl.appendChild(e); });
const sign = document.createElement('span'); sign.className='sign'; sign.textContent = `— ${CONFIG.yourName} ♡`;
sign.style.animationDelay = (1.2+CONFIG.letter.length*1.1)+'s'; letterEl.appendChild(sign);

/* ---------- photos (config file, or ?edit picker) ---------- */
$$('[data-photo]').forEach(el=>{
  const i = +el.dataset.photo;
  const set = src => { let img=el.querySelector('img'); if(!img){ img=new Image(); img.alt=''; el.appendChild(img);} img.src=src; };
  const saved = store.get('photo'+i);
  if (saved) set(saved);
  else if (CONFIG.photos[i]) { const t=new Image(); t.onload=()=>set(CONFIG.photos[i]); t.src=CONFIG.photos[i]; }
  if (EDIT) el.addEventListener('click', ev=>{
    ev.stopPropagation(); const pk=$('#picker'); pk.onchange = () => { const f=pk.files[0]; if(!f) return; shrink(f,1000).then(url=>{ set(url); store.set('photo'+i,url); }); pk.value=''; }; pk.click();
  });
});
function shrink(file,max){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

/* ---------- music ---------- */
const bgm=$('#bgm'), muteBtn=$('#mute');
if (CONFIG.music){ bgm.src=CONFIG.music; muteBtn.hidden=false; muteBtn.onclick=()=>{ if(bgm.paused){bgm.play();muteBtn.textContent='🔊'}else{bgm.pause();muteBtn.textContent='🔇'} }; }

/* ---------- screens ---------- */
const screens=$$('.screen');
function show(id){
  const cur=screens.find(s=>s.classList.contains('active'));
  const go=()=>{ screens.forEach(s=>{ s.classList.remove('leaving'); s.classList.toggle('active', s.id===id); }); $('#'+id).scrollTop=0;
    if(id==='s5'){ restartAnim('#s5 .pop-in span'); restartAnim('#letter p, #letter .sign'); } };
  if(cur && cur.id!==id){ cur.classList.add('leaving'); setTimeout(go,300); } else go();
}
function restartAnim(sel){ $$(sel).forEach(e=>{ e.style.animation='none'; void e.offsetWidth; e.style.animation=''; }); }

/* ---------- effects ---------- */
function burst(x,y,n=9,syms=['heart','star','flower']){
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='fx burst';
    const s=16+Math.random()*22, a=Math.random()*Math.PI*2, r=40+Math.random()*80;
    d.style.cssText=`left:${x-s/2}px;top:${y-s/2}px;width:${s}px;height:${s}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-30}px;--rot:${(Math.random()-.5)*200}deg`;
    d.innerHTML=`<svg viewBox="0 0 100 100"><use href="#${syms[Math.random()*syms.length|0]}"/></svg>`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),950);
  }
}
function shower(n=22){
  const set=['heart','flower','star','starY','plum'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='fx rise';
    const s=18+Math.random()*30;
    d.style.cssText=`left:${Math.random()*100}vw;top:100vh;width:${s}px;height:${s}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*1.4}s`;
    d.innerHTML=`<svg viewBox="0 0 100 100"><use href="#${set[Math.random()*set.length|0]}"/></svg>`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),8000);
  }
}
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.poly')) burst(e.clientX,e.clientY,7); });
const buzz=(ms=15)=>{ try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){} };

/* parallax: stickers drift with mouse / device tilt */
addEventListener('pointermove',e=>{ if(e.pointerType==='touch') return; const r=document.documentElement; r.style.setProperty('--mx',(e.clientX/innerWidth-.5)); r.style.setProperty('--my',(e.clientY/innerHeight-.5)); });

/* ---------- flow ---------- */
$('#yes').onclick=()=>{ buzz(); if(CONFIG.music) bgm.play().catch(()=>{}); show('s2'); };
$('#no').onclick =()=>{ buzz(30); show('s3'); };
$('#back').onclick=()=>{ entered=''; drawDots(); show('s1'); };

/* playful: YES grows each time you hover NO */
let grow=1; $('#no').addEventListener('pointerenter',()=>{ grow=Math.min(grow+.12,1.5); $('#yes').style.transform=`scale(${grow})`; });

/* ---------- keypad ---------- */
let entered=''; const len=CONFIG.passcode.length, disp=$('#disp'), keys=$('#keys');
function drawDots(){ disp.innerHTML=Array.from({length:len},(_,i)=>`<i class="${i<entered.length?'on':''}"></i>`).join(''); }
['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{
  const b=document.createElement('button'); b.type='button'; b.className='key'; b.textContent=k; b.onclick=()=>press(k); keys.appendChild(b);
});
function press(k){
  buzz(10);
  if(k==='⌫') entered=entered.slice(0,-1);
  else if(k==='✓'){ check(); return; }
  else if(entered.length<len) entered+=k;
  drawDots();
  if(entered.length===len && k!=='⌫') setTimeout(check,220);
}
function check(){
  if(entered===CONFIG.passcode){ entered=''; drawDots(); buzz([20,40,20]); show('s4'); setTimeout(()=>shower(14),500); }
  else{ buzz(80); const p=$('#pad'); p.classList.add('shake'); setTimeout(()=>p.classList.remove('shake'),450); entered=''; drawDots(); setTimeout(()=>show('s3'),450); }
}
addEventListener('keydown',e=>{
  if(!$('#s2').classList.contains('active')) return;
  if(/^\d$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('⌫'); else if(e.key==='Enter') press('✓');
});
drawDots();

/* ---------- envelope ---------- */
const env=$('#env');
env.onclick=e=>{
  if(env.classList.contains('open')) return;
  env.classList.add('open'); $('#tapHint').style.visibility='hidden'; buzz(30);
  const r=env.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 14);
  setTimeout(()=>{ show('s5'); setTimeout(()=>shower(26),400); }, 1500);
};

/* ---------- draggable polaroids ---------- */
let z=10;
$$('.poly').forEach(p=>{
  let sx,sy,ox,oy,drag=false;
  p.addEventListener('pointerdown',e=>{ if(EDIT && e.target.closest('.ph')) return; drag=true; p.setPointerCapture(e.pointerId); p.classList.add('drag'); p.style.zIndex=++z;
    const b=p.getBoundingClientRect(), pr=p.offsetParent.getBoundingClientRect(); ox=b.left-pr.left; oy=b.top-pr.top; sx=e.clientX; sy=e.clientY;
    p.style.left=ox+'px'; p.style.top=oy+'px'; p.style.right='auto'; e.stopPropagation(); });
  p.addEventListener('pointermove',e=>{ if(!drag) return; const par=p.offsetParent;
    const nx=Math.max(-20,Math.min(par.clientWidth-p.offsetWidth+20, ox+e.clientX-sx)), ny=Math.max(-20,Math.min(par.clientHeight-p.offsetHeight+20, oy+e.clientY-sy));
    p.style.left=nx+'px'; p.style.top=ny+'px'; });
  const end=()=>{ drag=false; p.classList.remove('drag'); };
  p.addEventListener('pointerup',end); p.addEventListener('pointercancel',end);
});
</script>
</body>
</html>
